<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrega de Kits</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#0c3167;color:#fff;padding:15px 16px}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce4ef;border-radius:15px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#6b7788;font-size:13px}button,.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#0c5bd7;color:#fff}.ok{background:#15803d;color:#fff}.danger{background:#b42318;color:#fff}.ghost{background:#edf2f8;color:#26364b}.route{border-left:4px solid #0c5bd7}.stop{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:12px 0;border-top:1px solid #edf1f6}.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e9f0fa;font-weight:900}.info span{display:block;font-size:13px;color:#627087;margin:3px 0}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.gps{background:#eef5ff;color:#0758c9;border:1px solid #bfd5f5;padding:7px 10px;border-radius:8px;font-weight:800;text-decoration:none;font-size:13px}.wa{padding:7px 0}.acts{grid-column:2;display:flex;gap:7px;flex-wrap:wrap}.done{opacity:.65}.login{max-width:390px;margin:13vh auto;padding:18px}.login input{width:100%;padding:12px;margin-bottom:10px;border:1px solid #cfd9e6;border-radius:10px}</style></head><body><div id="app"></div><script>
const URL='https://uelbxjcmmoivygohuoca.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.'+'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlbGJ4amNtbW9pdnlnb2h1b2NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA0NzQ2MzEsImV4cCI6MjA2NjA1MDYzMX0.'+'yjJKF9YBdPUFtM5h9w5tV-tlP1AZ4Xt71lK4wI1ft0E';const db=supabase.createClient(URL,KEY),A=document.getElementById('app');let S={user:null,batches:[],current:null,currentData:null};const x=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function address(c){return[c.address||c.street,c.number,c.complement,c.neighborhood,c.city,c.state,c.zip].filter(Boolean).join(', ')}async function login(){let e=document.getElementById('em').value,p=document.getElementById('pw').value,m=document.getElementById('msg');m.textContent='Entrando...';let{data,error}=await db.auth.signInWithPassword({email:e,password:p});if(error)m.textContent=error.message;else{S.user=data.user;boot()}}async function boot(){let{data}=await db.from('kit_delivery_batches').select('*').order('created_at',{ascending:false}).limit(50);S.batches=data||[];render()}function render(){if(!S.user)return;A.innerHTML=`<div class="top"><div class="row between"><b>📦 Entrega de Kits</b><button class="ghost" id="out">Sair</button></div></div><div class="wrap"><div class="card"><label><b>Lote</b></label><select id="batch" style="width:100%;padding:12px;border:1px solid #cfd9e6;border-radius:10px"><option value="">Selecione</option>${S.batches.map(b=>`<option value="${b.id}" ${S.current===b.id?'selected':''}>${x(b.name)}</option>`).join('')}</select></div>${S.currentData?routes():''}</div>`;document.getElementById('out').onclick=async()=>{await db.auth.signOut();location.reload()};document.getElementById('batch').onchange=async e=>{S.current=e.target.value;if(S.current)await openBatch(S.current);else S.currentData=null;render()};document.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>status(el.dataset.i,el.dataset.s))}function routes(){let d=S.currentData,total=d.items.length,done=d.items.filter(i=>i.status==='delivered').length;return`<div class="card"><div class="row between"><b>Progresso</b><span>${done}/${total} entregues</span></div></div>${d.routes.map(r=>route(r)).join('')}`}function route(r){let its=S.currentData.items.filter(i=>i.route_id===r.id).sort((a,b)=>a.stop_order-b.stop_order);return`<div class="card route"><div class="row between"><div><b>Trecho ${r.route_order}</b><div class="muted">${its.length} paradas</div></div><a class="btn primary" href="${x(r.maps_url)}" target="_blank">🧭 Google Maps</a></div>${its.map((i,k)=>stop(i,k)).join('')}</div>`}function stop(i,k){let c=i.c||{},done=i.status==='delivered',ph=String(c.phone||'').replace(/\D/g,''),wa=ph.startsWith('55')?ph:'55'+ph,gps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address(c))}`;return`<div class="stop ${done?'done':''}"><div class="num">${done?'✓':k+1}</div><div class="info"><b>${x(c.name||'Contato')}</b><span>${x(address(c))}</span><div class="links">${ph?`<a class="wa" href="https://wa.me/${wa}" target="_blank">WhatsApp</a>`:''}<a class="gps" href="${gps}" target="_blank">📍 Abrir GPS</a></div></div><div class="acts">${done?`<button data-i="${i.id}" data-s="pending" class="ghost">Desfazer</button>`:`<button data-i="${i.id}" data-s="delivered" class="ok">Entregue</button><button data-i="${i.id}" data-s="not_found" class="danger">Não localizado</button>`}</div></div>`}async function openBatch(id){let R=await db.from('kit_delivery_routes').select('*').eq('batch_id',id).order('route_order'),I=await db.from('kit_delivery_items').select('*').eq('batch_id',id).order('stop_order'),ids=[...new Set((I.data||[]).map(i=>i.contact_id))],cs=[];for(let k=0;k<ids.length;k+=300){let q=await db.from('contacts').select('id,name,phone,street,address,number,complement,neighborhood,city,state,zip').in('id',ids.slice(k,k+300));cs.push(...(q.data||[]))}let M=Object.fromEntries(cs.map(c=>[c.id,c]));S.currentData={routes:R.data||[],items:(I.data||[]).map(i=>({...i,c:M[i.contact_id]}))}}async function status(id,s){let{error}=await db.from('kit_delivery_items').update({status:s,delivered_at:s==='delivered'?new Date().toISOString():null}).eq('id',id);if(error)return alert(error.message);await openBatch(S.current);render()} (async()=>{let{data}=await db.auth.getSession();if(data.session){S.user=data.session.user;boot()}else A.innerHTML=`<div class="login card"><h2>📦 Entrega de Kits</h2><p class="muted">Entre com o mesmo usuário do CRM.</p><input id="em" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha"><button class="primary" style="width:100%" id="go">Entrar</button><p id="msg" class="muted"></p></div>`,document.getElementById('go').onclick=login})();
</script></body></html>
