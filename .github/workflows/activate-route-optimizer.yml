name: Ativar roteirizador
on:
  push:
    paths:
      - 'route-optimizer.js'
      - '.github/workflows/activate-route-optimizer.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcoes seguras no app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          if 'route-optimizer.js' not in s:
              s=s.replace("</body></html>", '<script src="./route-optimizer.js"></script></body></html>')
          old='S.all=a;S.busy=false}'
          new="S.all=[...new Map(a.filter(c=>c.contact_id).map(c=>[c.contact_id,c])).values()];S.busy=false}"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: contatos unicos na montagem de rota"
          git push
