name: Ativar roteirizador
on:
  push:
    paths:
      - 'route-optimizer.js'
      - '.github/workflows/activate-route-optimizer.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar v6.16
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          idx=Path('index.html')
          s=idx.read_text()
          s=s.replace('route-optimizer.js?v=6.15.0','route-optimizer.js?v=6.16.0')
          idx.write_text(s)
          p=Path('route-optimizer.js')
          s=p.read_text()
          s=s.replace('roteirizacao operacional v6.15','roteirizacao operacional v6.16')
          old_progress="  function progress(t){let b=document.getElementById('optimizeRoute');if(b){b.disabled=true;b.textContent=t}let m=document.getElementById('make');if(m){m.disabled=true;m.textContent=t}}"
          new_progress=base64.b64decode('').decode()
          if old_progress in s:
              s=s.replace(old_progress,new_progress,1)
          old_create=base64.b64decode('').decode()
          new_create=base64.b64decode('').decode()
          if old_create not in s:
              raise SystemExit('create marker not found')
          s=s.replace(old_create,new_create,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html route-optimizer.js
          git diff --cached --quiet || git commit -m "v6.16 valida lote completo e progresso visual"
          git push
